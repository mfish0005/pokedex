<div class="pokemon-info">  
  <div class="info-grid">
    <div class="info-item is-flex">
      <span class="has-text-weight-semibold has-text-gray-dark">Height:</span>
      <span class="info-value">{{ formatHeight(pokemon().height) }}</span>
    </div>
    <div class="info-item is-flex">
      <span class="has-text-weight-semibold has-text-gray-dark">Weight:</span>
      <span class="info-value">{{ formatWeight(pokemon().weight) }}</span>
    </div>
    <div class="info-item is-flex">
      <span class="has-text-weight-semibold has-text-gray-dark">Base Experience:</span>
      <span class="info-value">{{ pokemon().baseExperience }}</span>
    </div>
  </div>
</div>
