<header class="pokedex-header is-flex-centered has-background-red">
  <div class="pokedex-device">
    <div class="pokedex-screen">
      <div class="screen-content has-text-centered">
        <h1 class="pokedex-title is-uppercase has-text-yellow">POKEDEX</h1>
        <div class="pokeball-container is-flex-centered has-margin-top-1 has-margin-bottom-1">
          <div class="pokeball">
            <div class="pokeball-top"></div>
            <div class="pokeball-center">
              <div class="pokeball-button"></div>
            </div>
            <div class="pokeball-bottom"></div>
          </div>
        </div>
        <p class="pokedex-subtitle is-size-7 has-text-green-light is-marginless has-margin-bottom-1">Pokemon Database</p>
        
        <div class="navigation-buttons is-flex-centered">
          @if (!isOnPokemonListPage()) {
            <fish-button 
              [routerLink]="['/']" 
              variant="secondary" 
              size="small">
              View All
            </fish-button>
          }
          <fish-button 
            [routerLink]="['/pokemon/create']" 
            variant="primary" 
            size="small">
            Create Pokemon
          </fish-button>
        </div>
      </div>
    </div>
    
    <div class="pokedex-controls is-flex-centered has-margin-bottom-1">
      <div class="control-button red-button"></div>
      <div class="control-button yellow-button"></div>
      <div class="control-button green-button"></div>
    </div>
    
    <div class="pokedex-antenna">
      <div class="antenna-base"></div>
      <div class="antenna-tip"></div>
    </div>
  </div>
</header>
