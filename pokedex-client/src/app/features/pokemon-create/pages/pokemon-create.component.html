@let current = state();

<div class="pokemon-create-container">
  <div class="pokemon-create-header has-text-centered has-margin-bottom-2">
    <h1 class="is-size-2 has-text-weight-light has-text-warning">Create New Pokemon</h1>
    <p class="is-size-5 has-text-white is-marginless">Add a new Pokemon to the Pokedex with all its details.</p>
  </div>

  @if (current.status === 'failed') {
    <div class="error-message has-background-white has-text-danger" role="alert">{{ current.message }}</div>
  }

  <app-pokemon-create-form
    [creating]="current.status === 'saving'"
    [serverErrors]="current.status === 'failed' ? current.fieldErrors : noFieldErrors"
    (create)="create($event)"
    (cancel)="cancel()" />
</div>
